<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sp-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="sp-stroke" x1="8" y1="32" x2="56" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="sp-glow" x1="32" y1="12" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
    <filter id="sp-shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06B6D4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Container Base with Soft Slate Border -->
  <rect width="64" height="64" rx="16" fill="url(#sp-bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="32" cy="32" r="18" fill="url(#sp-glow)"/>

  <!-- The SponsorPulse Heartbeat Waveform -->
  <path
    d="M10 33 H19 L25 18 L34 46 L42 26 L47 33 H54"
    stroke="url(#sp-stroke)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#sp-shadow)"
  />

  <!-- Partnership Signal Beacon (Upper Peak) -->
  <circle cx="25" cy="18" r="3" fill="#FFFFFF"/>
  <circle cx="25" cy="18" r="5" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Delivery / Closure Node (Trailing) -->
  <circle cx="54" cy="33" r="2.5" fill="#6366F1"/>
</svg>
